name: Release Loki

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release tag & ensure GitHub Release exists
        id: meta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --title "Loki ${TAG} — Lokala mötesanteckningar" \
              --notes $'## Nedladdning ('"${TAG}"$')\n- **`Loki-portabel.exe`** — Portabel för Windows (ingen installation krävs)\n- **`Loki_*_x64-setup.exe`** — Windows-installerare (Start-menyn)\n- **`Loki_*_aarch64.dmg`** — macOS Apple Silicon (Metal-accelererad)'
          fi

  release-windows:
    needs: prepare-release
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: "C:\\Program Files\\LLVM\\bin"
      CARGO_TARGET_DIR: D:\t
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Enable Long Paths
        run: |
          git config --system core.longpaths true
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -Force

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build and Upload Tauri App (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseName: "Loki ${{ needs.prepare-release.outputs.tag }} — Lokala mötesanteckningar"
          releaseDraft: false
          prerelease: false

      - name: Copy & Upload Portable Windows EXE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          $exePaths = @(
            "D:\t\release\loki.exe",
            "D:\t\x86_64-pc-windows-msvc\release\loki.exe"
          )
          $found = $false
          foreach ($p in $exePaths) {
            if (Test-Path $p) {
              Copy-Item -Path $p -Destination "Loki-portabel.exe"
              gh release upload $env:REL_TAG "Loki-portabel.exe" --clobber
              $found = $true
              break
            }
          }
          if (-not $found) {
            Write-Error "Hittade inte loki.exe i $env:CARGO_TARGET_DIR"
          }

  release-macos:
    needs: prepare-release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build and Upload macOS Apple Silicon DMG
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseName: "Loki ${{ needs.prepare-release.outputs.tag }} — Lokala mötesanteckningar"
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin
