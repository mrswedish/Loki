[package]
name = "loki"
version = "3.0.4"
description = "Loki — 100 % lokala mötesanteckningar och protokoll"
authors = ["Patrik Svensk"]
edition = "2021"

[features]
default = []
vulkan = ["llama-cpp-2/vulkan"]

[lib]
name = "loki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "native-tls"] }
futures-util = "0.3"
sysinfo = "0.33"

# Portabel dokumentimport (Word .docx/.odt, Excel .xlsx/.xls/.ods, PDF .pdf) + äkta .docx-export i Rust
calamine = "0.28"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
pdf-extract = "0.7"

# In-process lokal LLM-inferens via llama.cpp (Gemma 4 E2B / E4B QAT GGUF)
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["sampler"] }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["metal", "sampler"] }

# Optimera dependencies (inkl. llama.cpp C++-kärnor) med O3 även i debug-bygget
[profile.dev.package."*"]
opt-level = 3
